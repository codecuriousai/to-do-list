name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Langflow API
        id: langflow_call
        env:
          API_KEY: "AstraCS:doJijFJwFioApBaswsaRBigy:5863ee7b2f203becbd015d24db02193c98d6aaccd317b4c247c70b12ffa88bc4"
          API_ENDPOINT: "https://api.langflow.astra.datastax.com/lf/720b3827-93a5-40a1-9c93-0a974680f48c/api/v1/run"
          FLOW_ID: "43913ec5-a0de-44b8-b31b-44019176489d"
          GITHUB_TOKEN: ${{ secrets.LANGFLOW_API_KEY }}
        run: |
          repo_url="https://github.com/${{ github.repository }}"
          branch_name="PR-Comments-Post"
          github_token="${GITHUB_TOKEN}"
          per_page=10
          max_pages=5
          pr_number=${{ github.event.pull_request.number }}
          session_id="user_$(date +%s)"

          echo "Calling Langflow for PR #$pr_number on branch $branch_name"

          payload=$(printf '{
            "tweaks": {
              "GitHubBranchPRsFetcher-Cdz4k": {
                "repo_url": "%s",
                "branch_name": "%s",
                "github_token": "%s",
                "per_page": %d,
                "max_pages": %d,
                "pr_number": %d
              }
            },
            "session_id": "%s",
            "body": "Hi"
          }' \
          "$repo_url" "$branch_name" "$github_token" "$per_page" "$max_pages" "$pr_number" "$session_id")

          echo "Calling Langflow with payload:"
          echo "$payload"

          response=$(curl -s -X POST "$API_ENDPOINT/$FLOW_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$payload")

          echo "Langflow raw response:"
          echo "$response"

          echo "response_json=$response" >> $GITHUB_OUTPUT

      - name: Create PR Analysis Check Run with buttons
        uses: actions/github-script@v6
        with:
          script: |
            const raw = `${{ steps.langflow_call.outputs.response_json }}`;
            let messageText = '';

            // Log raw for easier debugging
            core.info(`Langflow raw: ${raw}`);

            try {
              const responseObj = JSON.parse(raw);
              // Log outputs to check nesting
              core.info(`Langflow outputs: ${JSON.stringify(responseObj.outputs)}`);
              messageText =
                responseObj?.outputs?.?.outputs?.?.results?.message?.text || '';
              core.info(`Langflow messageText: ${messageText}`);
            } catch (err) {
              core.setFailed(`❌ Failed to parse Langflow response JSON: ${err.message}`);
              return;
            }

            // Robust extraction
            function extractAndParseJSON(text) {
              // Strategy 1: Remove markdown
              try {
                const cleaned = text.replace(/``````\s*/gi, '').trim();
                return JSON.parse(cleaned);
              } catch (e) {}

              // Strategy 2: Extract array
              try {
                const arrayMatch = text.match(/\[[\s\S]*\]/);
                if (arrayMatch) {
                  return JSON.parse(arrayMatch);
                }
              } catch (e) {}

              // Strategy 3: Extract object
              try {
                const objectMatch = text.match(/\{[\s\S]*\}/);
                if (objectMatch) {
                  return JSON.parse(objectMatch);
                }
              } catch (e) {}

              // Strategy 4: Find first JSON after text
              try {
                const start = Math.min(
                  text.indexOf('{') === -1 ? Infinity : text.indexOf('{'),
                  text.indexOf('[') === -1 ? Infinity : text.indexOf('[')
                );
                const end = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
                if (start !== Infinity && end !== -1) {
                  const candidate = text.substring(start, end + 1).trim();
                  return JSON.parse(candidate);
                }
              } catch (e) {}

              throw new Error('Unable to extract valid JSON from messageText');
            }

            let parsedResult = {};
            try {
              parsedResult = extractAndParseJSON(messageText);
              core.info(`Langflow parsed result: ${JSON.stringify(parsedResult)}`);
            } catch (err) {
              core.setFailed(`❌ Failed to extract JSON from Langflow message text: ${err.message}`);
              return;
            }

            // Whatever you want to do with the parsedResult next...
            // For example, displaying it in a PR comment

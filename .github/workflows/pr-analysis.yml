name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Langflow API
        id: langflow_call
        env:
          API_KEY: "AstraCS:doJijFJwFioApBaswsaRBigy:5863ee7b2f203becbd015d24db02193c98d6aaccd317b4c247c70b12ffa88bc4"
          API_ENDPOINT: "https://api.langflow.astra.datastax.com/lf/720b3827-93a5-40a1-9c93-0a974680f48c/api/v1/run"
          FLOW_ID: "ca1962e2-2272-406a-a925-2625b7c52812"
          GITHUB_TOKEN: "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"
        run: |
          repo_url="https://github.com/${{ github.repository }}"
          branch_name="${{ github.event.pull_request.head.ref }}"
          github_token="${GITHUB_TOKEN}"
          per_page=10
          max_pages=5
          pr_number=${{ github.event.pull_request.number }}
          session_id="user_$(date +%s)"
          
          echo "pr_number:"
          echo "$pr_number"
          
          echo "branch_name:"
          echo "$branch_name"
          
          # Construct JSON payload using printf
          payload=$(printf '{
            "tweaks": {
              "GitHubBranchPRsFetcher-Cdz4k": {
                "repo_url": "%s",
                "branch_name": "%s",
                "github_token": "%s",
                "per_page": %d,
                "max_pages": %d,
                "pr_number": %d
              }
            },
            "session_id": "%s",
            "body": "Analyze and suggest fixes for Pull Request #%d from repository %s."
          }' \
          "$repo_url" "$branch_name" "$github_token" "$per_page" "$max_pages" "$pr_number" "$session_id" "$pr_number" "$repo_url")

          echo "Calling Langflow with payload:"
          echo "$payload"

          response=$(curl -s -X POST "$API_ENDPOINT/$FLOW_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$payload")

          echo "Langflow response: $response"

          # Extract result message safely using jq (fallback to 'needs_comments')
          result=$(echo "$response" | jq -r '.outputs[0].outputs[1].results.message.text' 2>/dev/null || echo "needs_comments")

          echo "result=$result" >> $GITHUB_OUTPUT

      - name: Create PR Analysis Check Run with buttons
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const resultText = process.env['result']?.toLowerCase() || '';
            const properlyReviewed = resultText.includes('properly_reviewed') || resultText.includes('ready to merge');

            const checkName = 'PR Analysis';
            const actions = properlyReviewed
              ? [{ label: 'Merge PR', identifier: 'merge_pr' }]
              : [{ label: 'Post Comments', identifier: 'post_comments' }];

            await github.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: checkName,
                summary: properlyReviewed
                  ? 'Langflow: PR is properly reviewed. You can merge it.'
                  : 'Langflow: PR needs comments. Please review and comment.'
              },
              actions: actions,
            });

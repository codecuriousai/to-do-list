name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Langflow API
        id: langflow_call
        env:
          API_KEY: "AstraCS:doJijFJwFioApBaswsaRBigy:5863ee7b2f203becbd015d24db02193c98d6aaccd317b4c247c70b12ffa88bc4"
          API_ENDPOINT: "https://api.langflow.astra.datastax.com/lf/720b3827-93a5-40a1-9c93-0a974680f48c/api/v1/run"
          FLOW_ID: "43913ec5-a0de-44b8-b31b-44019176489d"
          GITHUB_TOKEN: ${{ secrets.LANGFLOW_API_KEY }}
        run: |
          repo_url="https://github.com/${{ github.repository }}"
          branch_name="PR-Comments-Post"
          github_token="${GITHUB_TOKEN}"
          per_page=10
          max_pages=5
          pr_number=${{ github.event.pull_request.number }}
          session_id="user_$(date +%s)"

          echo "Calling Langflow for PR #$pr_number on branch $branch_name"

          payload=$(printf '{
            "tweaks": {
              "GitHubBranchPRsFetcher-Cdz4k": {
                "repo_url": "%s",
                "branch_name": "%s",
                "github_token": "%s",
                "per_page": %d,
                "max_pages": %d,
                "pr_number": %d
              }
            },
            "session_id": "%s",
            "body": "Hi"
          }' \
          "$repo_url" "$branch_name" "$github_token" "$per_page" "$max_pages" "$pr_number" "$session_id")

          echo "Calling Langflow with payload:"
          echo "$payload"

          response=$(curl -s -X POST "$API_ENDPOINT/$FLOW_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$payload")

          echo "Langflow raw response:"
          echo "$response"

          echo "response_json=$response" >> $GITHUB_OUTPUT

      - name: Create PR Analysis Check Run with buttons
        uses: actions/github-script@v6
        with:
          script: |
            const raw = `${{ steps.langflow_call.outputs.response_json }}`;

            // Verbose logging for easier diagnostics
            core.info(`Langflow raw response: ${raw}`);

            let messageText = '';
            try {
              const responseObj = JSON.parse(raw);
              core.info(`Langflow outputs: ${JSON.stringify(responseObj.outputs)}`);
              messageText =
                responseObj?.outputs?.?.outputs?.[11]?.results?.message?.text || '';
              core.info(`Langflow messageText: ${messageText}`);
            } catch (err) {
              core.setFailed(`❌ Failed to parse Langflow response JSON: ${err.message}`);
              return;
            }

            // CLEAN THE MESSAGE BEFORE PARSING
            function cleanForJSON(text) {
              let cleaned = text.trim()
                .replace(/```
                .replace(/```\s*/gi, '')
                .replace(/{{/g, '{')              // Replace double curly brackets
                .replace(/}}/g, '}')
                .replace(/“|”/g, '"')             // Replace curly quotes
                .replace(/‘|’/g, "'");

              // Strip leading content not part of a JSON object/array
              const fitStart = Math.min(
                cleaned.indexOf('{') === -1 ? Infinity : cleaned.indexOf('{'),
                cleaned.indexOf('[') === -1 ? Infinity : cleaned.indexOf('[')
              );
              if (fitStart !== Infinity) {
                cleaned = cleaned.substring(fitStart);
              }
              return cleaned;
            }

            // Robust JSON extraction with cleaning and regex
            function extractAndParseJSON(text) {
              const cleaned = cleanForJSON(text);
              core.info('Attempting extraction from cleaned:');
              core.info(cleaned);

              // Try parsing directly
              try {
                return JSON.parse(cleaned);
              } catch (e) {
                core.info('Direct parse failed, trying regex extraction...');
              }

              // Try extracting a JSON array
              const arrayMatch = cleaned.match(/\[[\s\S]*\]/);
              if (arrayMatch) {
                try {
                  return JSON.parse(arrayMatch);
                } catch (e) {}
              }

              // Try extracting a JSON object
              const objectMatch = cleaned.match(/\{[\s\S]*\}/);
              if (objectMatch) {
                try {
                  return JSON.parse(objectMatch);
                } catch (e) {}
              }

              core.error('Unable to extract valid JSON from messageText');
              throw new Error('Unable to extract valid JSON from messageText');
            }

            let parsedResult = {};
            try {
              parsedResult = extractAndParseJSON(messageText);
              core.info(`Langflow parsed result: ${JSON.stringify(parsedResult)}`);
            } catch (err) {
              core.setFailed(`❌ Failed to extract JSON from Langflow message text: ${err.message}`);
              return;
            }

            // Use parsedResult for PR comments/checks...
            // Example: core.info for logging, or post comments as needed.


name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Langflow API
        id: langflow_call
        env:
          API_KEY: "AstraCS:doJijFJwFioApBaswsaRBigy:5863ee7b2f203becbd015d24db02193c98d6aaccd317b4c247c70b12ffa88bc4"
          API_ENDPOINT: "https://api.langflow.astra.datastax.com/lf/720b3827-93a5-40a1-9c93-0a974680f48c/api/v1/run"
          FLOW_ID: "43913ec5-a0de-44b8-b31b-44019176489d"
          GITHUB_TOKEN: ${{ secrets.LANGFLOW_API_KEY }}
        run: |
          repo_url="https://github.com/${{ github.repository }}"
          branch_name="PR-Comments-Post"
          github_token="${GITHUB_TOKEN}"
          per_page=10
          max_pages=5
          pr_number=${{ github.event.pull_request.number }}
          session_id="user_$(date +%s)"

          echo "Calling Langflow for PR #$pr_number on branch $branch_name"

          payload=$(printf '{
            "tweaks": {
              "GitHubBranchPRsFetcher-Cdz4k": {
                "repo_url": "%s",
                "branch_name": "%s",
                "github_token": "%s",
                "per_page": %d,
                "max_pages": %d,
                "pr_number": %d
              }
            },
            "session_id": "%s",
            "body": "Hi"
          }' \
          "$repo_url" "$branch_name" "$github_token" "$per_page" "$max_pages" "$pr_number" "$session_id")

          echo "Calling Langflow with payload:"
          echo "$payload"

          response=$(curl -s -X POST "$API_ENDPOINT/$FLOW_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$payload")

          echo "Langflow response:"
          echo "$response"

          echo "response_json=$response" >> $GITHUB_OUTPUT

      - name: Create PR Analysis Check Run with buttons
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = `${{ steps.langflow_call.outputs.response_json }}`;

            function extractAndParseJSON(text) {
              const strategies = [
                (t) => t.replace(/```json\s*/gi, '').replace(/```\s*/gi, '').trim(),
                (t) => {
                  const start = Math.min(
                    t.indexOf('{') === -1 ? Infinity : t.indexOf('{'),
                    t.indexOf('[') === -1 ? Infinity : t.indexOf('[')
                  );
                  const end = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
                  return start !== Infinity && end !== -1
                    ? t.substring(start, end + 1)
                    : t;
                },
                (t) => {
                  const arrayMatch = t.match(/\[[\s\S]*\]/);
                  return arrayMatch ? arrayMatch[0] : t;
                },
                (t) => {
                  const objectMatch = t.match(/\{[\s\S]*\}/);
                  return objectMatch ? objectMatch[0] : t;
                }
              ];

              for (const strategy of strategies) {
                try {
                  const cleaned = strategy(text);
                  const parsed = JSON.parse(cleaned);
                  return parsed;
                } catch (e) {
                  continue;
                }
              }

              throw new Error('Unable to extract valid JSON from response');
            }

            const parsedResponse = extractAndParseJSON(raw);
            const resultText = JSON.stringify(parsedResponse).toLowerCase();
            echo "$parsedResponse"
            echo "$resultText"
            

name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Langflow API
        id: langflow_call
        env:
          API_KEY: "AstraCS:doJijFJwFioApBaswsaRBigy:5863ee7b2f203becbd015d24db02193c98d6aaccd317b4c247c70b12ffa88bc4"
          API_ENDPOINT: "https://api.langflow.astra.datastax.com/lf/720b3827-93a5-40a1-9c93-0a974680f48c/api/v1/run"
          FLOW_ID: "43913ec5-a0de-44b8-b31b-44019176489d"
          GITHUB_TOKEN: ${{ secrets.LANGFLOW_API_KEY }}
        run: |
          repo_url="https://github.com/${{ github.repository }}"
          branch_name="PR-Comments-Post"
          github_token="${GITHUB_TOKEN}"
          per_page=10
          max_pages=5
          pr_number=${{ github.event.pull_request.number }}
          session_id="user_$(date +%s)"

          echo "Calling Langflow for PR #$pr_number on branch $branch_name"

          payload=$(printf '{
            "tweaks": {
              "GitHubBranchPRsFetcher-Cdz4k": {
                "repo_url": "%s",
                "branch_name": "%s",
                "github_token": "%s",
                "per_page": %d,
                "max_pages": %d,
                "pr_number": %d
              }
            },
            "session_id": "%s",
            "body": "Hi"
          }' \
          "$repo_url" "$branch_name" "$github_token" "$per_page" "$max_pages" "$pr_number" "$session_id")

          echo "Calling Langflow with payload:"
          echo "$payload"

          response=$(curl -s -X POST "$API_ENDPOINT/$FLOW_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$payload")

          echo "Langflow raw response:"
          echo "$response"

          echo "response_json=$response" >> $GITHUB_OUTPUT

      - name: Process Langflow PR Analysis JSON
        uses: actions/github-script@v6
        env:
          LANGFLOW_RESPONSE_JSON: ${{ steps.langflow_call.outputs.response_json }}
        with:
          script: |
            // Function to strip markdown JSON code fences
            function stripMarkdownFences(text) {
              return text
                .replace(/``````json
                .replace(/``````
                .trim();
            }

            const raw = process.env.LANGFLOW_RESPONSE_JSON;
            core.info(`Raw Langflow response: ${raw}`);

            let responseObj;
            try {
              responseObj = JSON.parse(raw);
            } catch (err) {
              core.setFailed(`❌ Failed to parse Langflow response JSON: ${err.message}`);
              return;
            }

            const msgTextRaw = responseObj?.outputs?.[0]?.outputs?.[1]?.results?.message?.text;
            if (!msgTextRaw) {
              core.setFailed('❌ No message text found in Langflow response outputs.');
              return;
            }

            const msgText = stripMarkdownFences(msgTextRaw);

            let analysis;
            try {
              analysis = JSON.parse(msgText);
            } catch (err) {
              core.setFailed(`❌ Failed to parse cleaned analysis JSON: ${err.message}`);
              return;
            }

            core.info(`Parsed PR Analysis JSON: ${JSON.stringify(analysis, null, 2)}`);

            core.setOutput("pr_analysis_json", JSON.stringify(analysis));

            // You can extend this to post PR comments or create check runs as needed here

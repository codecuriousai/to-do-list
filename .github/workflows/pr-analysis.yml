name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.LANGFLOW_API_KEY }}
      API_ENDPOINT: ${{ secrets.LANGFLOW_API_ENDPOINT }}
      FLOW_ID: ${{ secrets.LANGFLOW_FLOW_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Langflow API
        id: langflow_call
        run: |
          repo_url="https://github.com/${{ github.repository }}"
          branch_name="${{ github.event.pull_request.head.ref }}"
          github_token="${GITHUB_TOKEN}"
          per_page=10
          max_pages=5
          pr_number=${{ github.event.pull_request.number }}
          session_id="user_$(date +%s)"

          # Construct JSON payload using printf to avoid EOF/heredoc issues
          payload=$(printf '{
            "tweaks": {
              "GitHubOpenPRsFetcher-t0YCZ": {
                "repo_url": "%s",
                "branch_name": "%s",
                "github_token": "%s",
                "per_page": %s,
                "max_pages": %s,
                "pr_number": %s
              }
            },
            "session_id": "%s",
            "body": "Analyze and suggest fixes for Pull Request #%s from repository %s. Please provide detailed fix suggestions, code improvements, and resolution recommendations."
          }' \
          "$repo_url" "$branch_name" "$github_token" "$per_page" "$max_pages" "$pr_number" "$session_id" "$pr_number" "$repo_url")

          echo "Calling Langflow..."
          response=$(curl -s -X POST "$API_ENDPOINT/$FLOW_ID" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            -d "$payload")

          echo "Langflow response: $response"

          # Extract response safely
          result=$(echo "$response" | jq -r '.outputs[0].outputs[0].results.message.text' || echo "needs_comments")

          echo "result=$result" >> $GITHUB_OUTPUT

      - name: Create PR Analysis Check Run with buttons
        uses: actions/github-script@v6
        with:
          script: |
            const resultText = `${{ steps.langflow_call.outputs.result }}`.toLowerCase();

            const properlyReviewed = resultText.includes('properly_reviewed') || resultText.includes('ready to merge');

            const checkName = 'PR Analysis';
            const actions = properlyReviewed
              ? [{ label: 'Merge PR', identifier: 'merge_pr' }]
              : [{ label: 'Post Comments', identifier: 'post_comments' }];

            await github.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: checkName,
                summary: properlyReviewed
                  ? 'Langflow: PR is properly reviewed. You can merge it.'
                  : 'Langflow: PR needs comments. Please review and comment.'
              },
              actions: actions,
            });

name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Langflow API
        id: langflow_call
        env:
          API_KEY: "AstraCS:doJijFJwFioApBaswsaRBigy:5863ee7b2f203becbd015d24db02193c98d6aaccd317b4c247c70b12ffa88bc4"
          API_ENDPOINT: "https://api.langflow.astra.datastax.com/lf/720b3827-93a5-40a1-9c93-0a974680f48c/api/v1/run"
          FLOW_ID: "43913ec5-a0de-44b8-b31b-44019176489d"
          GITHUB_TOKEN: ${{ secrets.LANGFLOW_API_KEY }}
        run: |
          repo_url="https://github.com/${{ github.repository }}"
          branch_name="${{ github.event.pull_request.head.ref }}"
          github_token="${GITHUB_TOKEN}"
          pr_number=${{ github.event.pull_request.number }}
          session_id="user_$(date +%s)"
          per_page=10
          max_pages=5

          # Construct payload
          payload=$(printf '{
            "tweaks": {
              "GitHubBranchPRsFetcher-Cdz4k": {
                "repo_url": "%s",
                "branch_name": "%s",
                "github_token": "%s",
                "per_page": %d,
                "max_pages": %d,
                "pr_number": %d
              }
            },
            "session_id": "%s",
            "body": "Analyze and review PR #%d on branch %s from %s"
          }' "$repo_url" "$branch_name" "$github_token" "$per_page" "$max_pages" "$pr_number" "$session_id")

          echo "Calling Langflow..."
          response=$(curl -s -X POST "$API_ENDPOINT/$FLOW_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$payload")

          echo "Langflow raw response:"
          echo "$response"

          # Encode for safety
          response_b64=$(echo "$response" | base64)
          echo "response_b64=$response_b64" >> $GITHUB_OUTPUT

      - name: Create PR Analysis Check Run with buttons
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.LANGFLOW_API_KEY }}
          script: |
            const b64 = `${{ steps.langflow_call.outputs.response_b64 }}`;
            const decoded = Buffer.from(b64, 'base64').toString('utf-8');

            let parsed;
            try {
              parsed = JSON.parse(decoded);
            } catch (e) {
              core.setFailed("❌ Failed to parse Langflow response JSON.");
              return;
            }

            // Extract review assessment
            const assessment = parsed?.comparison_analysis?.review_assessment?.toLowerCase() || '';

            const properlyReviewed = assessment === 'properly_reviewed';

            const checkName = 'PR Analysis';
            const actions = properlyReviewed
              ? [{ label: 'Merge PR', identifier: 'merge_pr' }]
              : [{ label: 'Post Comments', identifier: 'post_comments' }];

            const summary = properlyReviewed
              ? '✅ Langflow: PR is properly reviewed. You can merge it.'
              : '📝 Langflow: PR needs comments. Please review.';

            await github.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: checkName,
                summary: summary,
                text: JSON.stringify(parsed, null, 2)
              },
              actions: actions,
            });
